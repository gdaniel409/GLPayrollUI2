@let roles = (roles$ | async)!;

@if(roles){

    <table class="select-table" mat-table [dataSource]="roles">

        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let role">
                <mat-checkbox (change)="handleSelectionChange($event, role.id)"
                         [checked]="role.selected">
                    Select
                </mat-checkbox>
            </td>

        </ng-container>

        <ng-container matColumnDef="rolename">
            <th mat-header-cell *matHeaderCellDef>Role Name</th>
            <td mat-cell *matCellDef="let role">
                {{ role.roleName }}
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnNames" class="select-header-row"></tr>
        <tr mat-row *matRowDef="let row; columns: columnNames;" class="select-table-row"></tr>

    </table>

}@else {
    <div>Loading...</div>
}
